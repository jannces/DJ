# Apache VirtualHost for reaching the LGU Alicia LMS by IP address over the LAN
# (e.g. http://192.168.1.10 from another laptop), without a hostname or certificate.
#
# Use this for a quick office rollout. For the hardened HTTPS setup with
# lms.alicia.local, use apache-vhost.conf instead — see docs/Deployment.md §3.
# Full walkthrough: docs/LAN-Access.md
#
# Install (Windows/XAMPP): add this line to
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
#     Include "C:/xampp/htdocs/lms/deploy/apache-vhost-ip.conf"
# then restart Apache from the XAMPP Control Panel.
#
# BEFORE YOU RESTART, EDIT TWO THINGS BELOW:
#   1. The paths, if the project is not at C:/xampp/htdocs/lms
#   2. The "Require ip" line, so it matches your own LAN subnet:
#        192.168.1.x  -> Require ip 192.168.1.0/24
#        192.168.0.x  -> Require ip 192.168.0.0/24
#        10.0.0.x     -> Require ip 10.0.0.0/24
#      Run ipconfig on the server to see which one you are on.

<VirtualHost *:80>
    # No ServerName: this becomes the default host on port 80, so any
    # http://<server-ip>/ request lands on the application.
    DocumentRoot "C:/xampp/htdocs/lms/public"

    <Directory "C:/xampp/htdocs/lms/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All

        # LAN-only at the web tier. Edit to match your subnet (see header).
        Require ip 192.168.1.0/24 127.0.0.1
    </Directory>

    ErrorLog "logs/lms-ip-error.log"
    CustomLog "logs/lms-ip-access.log" combined
</VirtualHost>

# NOTE: this serves the app over plain HTTP — passwords and OTP codes are not
# encrypted in transit. Acceptable on a trusted, isolated office LAN for testing;
# for live use switch to the HTTPS VirtualHost in apache-vhost.conf.
#
# NOTE: with plain HTTP you must also set SESSION_SECURE_COOKIE=false in .env,
# otherwise the browser drops the session cookie and nobody can log in.
