# Apache VirtualHost for LGU Alicia LMS (LAN + HTTPS).
#
# Include this from httpd-vhosts.conf, and enable mod_ssl and mod_rewrite in
# httpd.conf. Generate the certificate first with deploy\make-cert.bat.
#
# ── TWO LINES TO EDIT BEFORE THIS WORKS ──────────────────────────────────────
#   1. DocumentRoot / <Directory>  — where the project actually sits.
#   2. `Require ip` in the <Directory> block — the subnet of the network this
#      server is on. THIS IS THE ONE THAT LOCKS PEOPLE OUT. It used to read
#      192.168.1.0/24, which is not the network this system has ever run on:
#      every client on 192.168.254.x would have been served a flat 403, and the
#      agency's own range will be different again.
#
#      Find it by running `ipconfig` on the server and reading the IPv4 address
#      and subnet mask. 192.168.254.17 / 255.255.255.0 means 192.168.254.0/24.
# ─────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName onealicialms.local
    # Plain HTTP exists only to send people to HTTPS. Nothing is served here.
    Redirect permanent / https://onealicialms.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName onealicialms.local
    DocumentRoot "C:/xampp/htdocs/lms/public"

    SSLEngine on
    SSLCertificateFile "C:/xampp/htdocs/lms/deploy/certs/lms.crt"
    SSLCertificateKeyFile "C:/xampp/htdocs/lms/deploy/certs/lms.key"

    # Modern protocols only. TLS 1.0 and 1.1 are withdrawn and a system that
    # advertises them fails the first thing any scanner checks.
    #
    # Written subtractively. "+TLSv1.3" is only understood by Apache 2.4.36
    # and later built against OpenSSL 1.1.1, and an unrecognised protocol
    # token is not ignored -- Apache refuses to start on it, which presents as
    # "Apache shutdown unexpectedly" with the reason buried in the log. This
    # form is accepted by every Apache 2.4 and leaves TLS 1.3 enabled wherever
    # it exists.
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # NO HSTS HEADER HERE, and that is deliberate.
    #
    # Strict-Transport-Security tells a browser to refuse this host over
    # anything but HTTPS -- and, in Chrome, to refuse a certificate it does not
    # trust with NO WAY TO CLICK PAST IT. With a self-signed certificate that
    # turns the first visit from a warning into a locked door, on every machine
    # in the office, with no obvious way back. Add it only if you move to a
    # certificate the clients actually trust.

    <Directory "C:/xampp/htdocs/lms/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All

        # LAN only: the office network and the server itself. Edit the subnet
        # to match this network -- see the note at the top of this file.
        Require ip 192.168.254.0/24
        Require ip 127.0.0.1
    </Directory>

    # Never serve the project's own files, only public/. A stray request for
    # /../.env has no business reaching the filesystem.
    <DirectoryMatch "^/.*/(app|bootstrap|config|database|deploy|resources|routes|storage|tests|vendor)/">
        Require all denied
    </DirectoryMatch>

    ErrorLog "logs/lms-error.log"
    CustomLog "logs/lms-access.log" combined
</VirtualHost>
