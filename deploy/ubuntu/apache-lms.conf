# Apache site for LGU Alicia LMS on Ubuntu (LAN + HTTPS).
#
# This is a TEMPLATE. deploy/ubuntu/install.sh fills in the four __PLACEHOLDERS__
# and writes the result to /etc/apache2/sites-available/lms.conf. Edit that
# file, not this one, if you need to change a running server -- then
#     sudo apache2ctl configtest && sudo systemctl reload apache2
#
# It is the Linux twin of deploy/apache-vhost.conf (the XAMPP/Windows one);
# the reasoning behind each choice is written out in full there.

<VirtualHost *:80>
    ServerName __SITE__
    ServerAlias __SERVER_IP__

    # Plain HTTP only redirects to HTTPS, on the same address the visitor used
    # (name stays name, IP stays IP). 302 so browsers never cache it forever.
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName __SITE__
    ServerAlias __SERVER_IP__ localhost

    DocumentRoot "__APP_DIR__/public"

    SSLEngine on
    SSLCertificateFile    "__APP_DIR__/deploy/certs/lms.crt"
    SSLCertificateKeyFile "__APP_DIR__/deploy/certs/lms.key"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    <Directory "__APP_DIR__/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All

        # LAN only: the network this server is on, and the server itself.
        # If PCs on ANOTHER subnet must reach it, add a line for that subnet.
        Require ip __SUBNET__
        Require ip 127.0.0.1 ::1
    </Directory>

    # Only public/ is ever served. The rest of the project (.env, storage,
    # vendor, ...) is denied outright; the more specific public/ block above
    # takes precedence for public/ itself.
    <Directory "__APP_DIR__">
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/lms-error.log
    CustomLog ${APACHE_LOG_DIR}/lms-access.log combined
</VirtualHost>
